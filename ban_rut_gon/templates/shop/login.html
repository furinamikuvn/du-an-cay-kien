{% extends 'shop/base.html' %}

{% block title %}Đăng Nhập Tài Khoản - AquaPlant{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white border border-slate-200 p-6 sm:p-8 space-y-5">
    
    <div class="text-center pb-3 border-b border-slate-100">
        <h1 class="text-lg font-bold text-slate-900">Đăng Nhập Hệ Thống</h1>
        <p class="text-xs text-slate-500 mt-1">Đăng nhập để theo dõi các đơn hàng bạn đã mua.</p>
    </div>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">{{ form.username.label }}</label>
            {{ form.username }}
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">{{ form.password.label }}</label>
            {{ form.password }}
        </div>

        <button type="submit" class="w-full bg-[#7AA88B] hover:bg-[#6B997C] text-white font-bold text-xs py-2.5 transition">
            Đăng Nhập
        </button>
    </form>

    <div class="text-center pt-3 border-t border-slate-100 text-xs text-slate-500">
        Chưa có tài khoản? 
        <a href="{% url 'register' %}" class="text-[#2F5C3E] font-bold hover:underline">Đăng ký thành viên mới</a>
    </div>

</div>
{% endblock %}
